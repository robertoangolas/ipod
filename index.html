<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>Meu iPod</title>
<style>
:root{--page:#d6d8db;--ink:#1c2630;--body:#f4f4f5;--lcd:#d4e3e8;--lcd2:#b9cfd6;--sel1:#5b9be0;--sel2:#2f7fd8;--wheel1:#f2f2f3;--wheel2:#c9cacd;--label:#7b7e84;--hub1:#fff;--hub2:#d7d8db;--scale:1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#17181a}}
:root[data-theme="dark"]{--page:#17181a}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--body);display:flex;align-items:center;justify-content:center;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
.device{--w:min(100vw,100dvh,560px);width:min(100%,calc(var(--w)*2.2));height:100%;box-sizing:border-box;display:grid;grid-template-columns:var(--gc,minmax(0,55fr) minmax(0,45fr));grid-template-rows:var(--gr,minmax(0,1fr) auto);gap:calc(var(--w)*.03);font-size:calc(var(--w)/24*var(--scale));padding:calc(var(--w)*.03);user-select:none;-webkit-user-select:none;touch-action:none}
@media (min-aspect-ratio:3/5){.device{height:100%}}
@media (max-height:640px){.art{width:2em;height:2em}}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:.5em;vertical-align:-.1em;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.screen{grid-column:var(--mcol,1);grid-row:1/3;min-height:0;background:color-mix(in srgb,var(--lcd) var(--pa,45%),transparent);backdrop-filter:blur(var(--bl,14px));-webkit-backdrop-filter:blur(var(--bl,14px));border:0;border-radius:1.4em;overflow:hidden;position:relative;color:var(--ink)}
.bar{height:1.8em;display:flex;align-items:center;justify-content:space-between;padding:0 .6em;background:var(--lcd2);border-bottom:0;font-weight:700;font-size:.95em}
.bar i{font-style:normal;font-size:.85em;width:2.2em}
.bar i:last-child{text-align:right}
ul{list-style:none;margin:0;padding:0}
li{height:1.9em;display:flex;align-items:center;justify-content:space-between;padding:0 .6em;gap:.6em;font-size:.95em}
li span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
li small{opacity:.65;font-size:.8em;white-space:nowrap}
li.sel{background:linear-gradient(var(--sel1),var(--sel2));color:#fff}
li.dim{opacity:.6}
.now{padding:.8em .9em;text-align:center}
.art{width:3em;height:3em;margin:.25em auto .3em;border-radius:.2em;background:linear-gradient(135deg,var(--sel1),var(--sel2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:2.4em;box-shadow:0 .1em .4em rgba(0,0,0,.3)}
.now b{display:block;font-size:1.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now em{display:block;font-style:normal;opacity:.7;font-size:.9em;margin-bottom:.6em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:.7em;border:1px solid #5d7881;border-radius:.4em;background:#eef5f7;overflow:hidden}
.track div{height:100%;background:linear-gradient(var(--sel1),var(--sel2));width:0}
.times{display:flex;justify-content:space-between;font-size:.8em;margin-top:.2em;opacity:.75}
.toast{position:absolute;left:.6em;right:.6em;bottom:.6em;background:rgba(20,30,40,.88);color:#fff;border-radius:.5em;padding:.45em .6em;font-size:.85em;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.wheel{position:relative;z-index:20;grid-column:var(--ocol,2);grid-row:var(--wrow,2);align-self:var(--wal,end);justify-self:center;width:calc(min(100%,38dvh)*var(--wk,1));aspect-ratio:1;margin:0;backdrop-filter:blur(var(--bw,16px)) saturate(1.4);-webkit-backdrop-filter:blur(var(--bw,16px)) saturate(1.4);border-radius:50%;background:var(--wheel2);box-shadow:none;cursor:pointer}
.wheel span{position:absolute;color:var(--label);font-weight:700;font-size:.95em;pointer-events:none}
.t{top:7%;left:50%;transform:translateX(-50%)}
.b{bottom:7%;left:50%;transform:translateX(-50%)}
.l{left:8%;top:50%;transform:translateY(-50%)}
.r{right:8%;top:50%;transform:translateY(-50%)}
.hub{position:absolute;inset:32%;border-radius:50%;background:var(--hub2);box-shadow:none;pointer-events:none}
.toast{z-index:30;position:fixed;top:calc(env(safe-area-inset-top,0px) + .6em);bottom:auto}
.pane{grid-column:var(--ocol,2);grid-row:var(--prow,1);align-self:start;justify-self:center;width:calc(100%*var(--pk,1));aspect-ratio:3/4;max-height:100%;box-sizing:border-box;border-radius:1.4em;overflow:hidden;background:color-mix(in srgb,var(--lcd) 70%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;padding:.6em;text-align:center;cursor:pointer}
.mrec{width:min(82%,26dvh);position:relative}
.mlabel{position:absolute;inset:28%;border-radius:50%;background:linear-gradient(135deg,var(--sel1),var(--sel2)) center/cover;box-shadow:0 0 0 .15em rgba(0,0,0,.55)}
.pane b,.pane em{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:normal}
.pane b{font-size:.9em}.pane em{font-size:.8em;opacity:.75}
.pane video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000;border-radius:.8em}
.empty{opacity:.7;font-size:.85em}
.bar{display:none}
.rng{width:100%;height:2.2em;accent-color:var(--sel2);margin-top:.6em}
.sv{font-size:1.6em!important;opacity:1!important}
.dlwin{position:fixed;inset:0;z-index:25;display:none;flex-direction:column;background:rgba(14,14,17,.97);color:#fff;font-size:calc(min(100vw,100dvh,560px)/24);padding-top:env(safe-area-inset-top,0px)}
.dlwin.on{display:flex}
.dlbar{display:flex;gap:.5em;padding:.7em}
.dlq{flex:1;min-width:0;font-size:1em;padding:.6em .8em;border-radius:2em;border:0;background:rgba(255,255,255,.14);color:#fff}
.dlq::placeholder{color:rgba(255,255,255,.6)}
.dlx,.dlgo{border:0;border-radius:2em;background:rgba(255,255,255,.18);color:#fff;font-size:1em;padding:.5em .9em;cursor:pointer}
.dlgo{background:linear-gradient(var(--sel1),var(--sel2))}
.dlmsg{padding:0 .9em .5em;font-size:.85em;opacity:.8}
.dlres{list-style:none;margin:0;padding:0 .7em 1em;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.dlres li{display:flex;gap:.8em;padding:.7em;margin-bottom:.6em;border-radius:.9em;background:rgba(255,255,255,.08);height:auto!important;font-size:1em!important;align-items:flex-start!important;justify-content:flex-start!important}
.dlres img{width:4.6em;height:4.6em;object-fit:cover;border-radius:.5em;flex:none;background:#333}
.dlres li>div{min-width:0;flex:1}
.dlres b,.dlres em,.dlres small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:normal}
.dlres em{opacity:.8;font-size:.9em}
.dlres small{opacity:.55;font-size:.75em}
.dlrow{display:flex;gap:.6em;align-items:center;margin-top:.4em}
.dlrow button{border:0;border-radius:2em;padding:.35em .9em;font-size:.85em;color:#fff;background:linear-gradient(var(--sel1),var(--sel2));cursor:pointer}
.dlrow button:disabled{opacity:.6}
.dlrow a{color:#fff;opacity:.8;font-size:.8em}
.dlsrc{padding:0 .9em .4em;font-size:.85em}
.dls{font-size:1em;border-radius:1em;border:0;background:rgba(255,255,255,.18);color:#fff;padding:.2em .5em}
.dls option{color:#000}
.dlbar,.dlsrc,.dlmsg,.dlres{width:100%;max-width:720px;margin-left:auto;margin-right:auto;box-sizing:border-box}
.dlrow{flex-wrap:wrap}
.dlres li b{margin-bottom:.15em}
.dlres li small{margin-top:.15em}
.dlres li>.dlph{flex:none;width:2.9em;height:2.9em;border-radius:.3em;background:linear-gradient(135deg,var(--sel1),var(--sel2));display:flex;align-items:center;justify-content:center;font-size:1.6em}
.screen ul{padding:.5em 0}
.pane{position:relative}
.pane video.pbg{position:absolute;inset:0;width:100%;height:100%;flex:none;object-fit:cover;border-radius:0;background:#000}
.pov{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;padding:.6em;background:rgba(0,0,0,.4);color:#fff}
@media (orientation:landscape){.vwin{padding:1em calc(min(100vw,100dvh)*.42) 1em 1em}}
.pick{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
.addbtn{position:relative;overflow:hidden;display:inline-block;margin:.4em 0 .6em;padding:.7em 1.5em;border-radius:2em;background:linear-gradient(var(--sel1),var(--sel2));color:#fff;font-weight:700;cursor:pointer}
.vwin{position:fixed;inset:0;z-index:5;font-size:calc(min(100vw,100dvh,560px)/24);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1em;background:#0e0e11;color:#fff;overflow:hidden;padding:1em 1em calc(min(100vw,100dvh,560px)*.5)}
.vwin.on{display:flex}
.vwin>*{position:relative}
.vwin>.vbg,.vwin>.vx{position:absolute}
.vbg{inset:-15%;background:#222 center/cover;filter:blur(26px) brightness(.4)}
.vx{top:.6em;left:.6em;width:2em;height:2em;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:1em;cursor:pointer;z-index:2}
.record{width:min(80%,calc(100dvh*.3))}
.record,.mrec{aspect-ratio:1;flex:none;border-radius:50%;background:conic-gradient(from 30deg,rgba(255,255,255,.1),transparent 18%,rgba(255,255,255,.16) 50%,transparent 68%,rgba(255,255,255,.1)),repeating-radial-gradient(circle,#0b0b0b 0 2px,#1b1b1b 2.5px 3.5px);box-shadow:0 .5em 2em rgba(0,0,0,.6),inset 0 0 0 .15em #2a2a2a;animation:spin 5s linear infinite}
.record.paused,.mrec.paused{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.record{animation:none}}
.vlabel{position:absolute;inset:27%;border-radius:50%;background:linear-gradient(135deg,var(--sel1),var(--sel2)) center/cover;display:flex;align-items:center;justify-content:center;font-size:2em;box-shadow:0 0 0 .25em rgba(0,0,0,.55)}
.vlabel::after{content:"";position:absolute;top:50%;left:50%;width:.8em;height:.8em;transform:translate(-50%,-50%);border-radius:50%;background:#0e0e11;box-shadow:none}
.vinfo{width:min(86%,22em);text-align:center}
.vinfo b{display:block;font-size:1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vinfo em{display:block;font-style:normal;opacity:.8;font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vinfo small{display:block;opacity:.55;font-size:.8em;min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vinfo .track{margin-top:.5em;background:rgba(255,255,255,.2);border-color:transparent;cursor:pointer}
.vinfo .times{color:#fff}
.vctl{display:flex;justify-content:center;gap:1.2em;margin-top:.3em}
.vctl button{background:none;border:0;color:#fff;font-size:1.5em;width:2em;height:2em;cursor:pointer;border-radius:50%}
.vctl button:focus-visible,.vx:focus-visible{outline:2px solid #fff}
</style>
</head>
<body>
<div class="device">
  <div class="screen" id="screen"><div class="bar" id="bar"></div><div id="body"></div><div class="vwin" id="vinyl"><div class="vbg" id="vbg"></div><button class="vx" id="vx" aria-label="Fechar">✕</button><div class="record paused" id="rec"><div class="vlabel" id="vlabel">♪</div></div><div class="vinfo"><b id="vt"></b><em id="va"></em><small id="vab"></small><div class="track" id="vtrack"><div id="vp"></div></div><div class="times"><span id="vc">0:00</span><span id="vd">-0:00</span></div><div class="vctl"><button id="vprev" aria-label="Anterior">⏮</button><button id="vplay" aria-label="Tocar ou pausar">❚❚</button><button id="vnext" aria-label="Próxima">⏭</button></div></div></div><div class="toast" id="toast"></div></div>
  <div class="pane" id="pane"></div>
  <div class="wheel" id="wheel" aria-label="Click wheel">
    <span class="t">MENU</span><span class="b">⏯</span><span class="l">⏮</span><span class="r">⏭</span><div class="hub"></div>
  </div>
</div>
<input type="color" id="color" style="position:fixed;opacity:0;pointer-events:none;width:0;height:0"><input type="file" id="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg" multiple style="position:fixed;left:-9999px;opacity:0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script>
(function(){
var VIS=7, UNK='Artista desconhecido';
var songs=[], stack=[], queue=[], qi=-1, db=null, memId=1, volTimer=0, toastTimer=0, confirmClear=false;
var audio=new Audio(); audio.volume=.8; var curUrl=null, volShownUntil=0;
var $screen=document.getElementById('screen'), $color=document.getElementById('color'), $bar=document.getElementById('bar'), $body=document.getElementById('body'), $toast=document.getElementById('toast'), $file=document.getElementById('file'), $wheel=document.getElementById('wheel');

/* ---------- armazenamento (IndexedDB) ---------- */
function openDB(){return new Promise(function(res){
  try{var r=indexedDB.open('meu-ipod',2);
    r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains('songs'))d.createObjectStore('songs',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('media'))d.createObjectStore('media',{keyPath:'id',autoIncrement:true});};
    r.onsuccess=function(){res(r.result);}; r.onerror=function(){res(null);};
  }catch(e){res(null);}});}
function dbAll(){return new Promise(function(res){
  if(!db)return res([]);
  try{var q=db.transaction('songs').objectStore('songs').getAll();q.onsuccess=function(){res(q.result||[]);};q.onerror=function(){res([]);};}catch(e){res([]);}});}
function dbAdd(s){return new Promise(function(res){
  if(!db){s.id=memId++;return res(s);}
  try{var q=db.transaction('songs','readwrite').objectStore('songs').add(s);
    q.onsuccess=function(){s.id=q.result;res(s);};q.onerror=function(){s.id=memId++;res(s);};
  }catch(e){s.id=memId++;res(s);}});}
function dbDel(id){return new Promise(function(res){
  if(!db)return res();
  try{var t=db.transaction('songs','readwrite');t.objectStore('songs').delete(id);t.oncomplete=res;t.onerror=res;}catch(e){res();}});}
function dbClear(){return new Promise(function(res){
  if(!db)return res();
  try{var t=db.transaction('songs','readwrite');t.objectStore('songs').clear();t.oncomplete=res;t.onerror=res;}catch(e){res();}});}

/* ---------- utilidades ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(t){if(!isFinite(t))t=0;var m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s;}
function parseName(n){
  var base=n.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim(), artist=UNK, title=base, i=base.indexOf(' - ');
  if(i>0){artist=base.slice(0,i).trim();title=base.slice(i+3).trim();}
  return {title:title||base,artist:artist||UNK};
}
function toast(msg){$toast.textContent=msg;$toast.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){$toast.classList.remove('on');},2200);}
function sorted(a){return a.slice().sort(function(x,y){return x.title.localeCompare(y.title,'pt-BR');});}
function cur(){return stack[stack.length-1];}
function nowSong(){return qi>=0?queue[qi]:null;}

/* ---------- telas ---------- */
function screenFor(type,arg){
  var s={type:type,idx:0,top:0,arg:arg,items:[]};
  if(type==='main'){
    s.title='Meu iPod';
    if(nowSong())s.items.push({l:'Tocando agora',act:showVinyl});
    s.items.push({l:'Músicas',sub:songs.length,go:['songs']},{l:'Vídeos',go:['videos']},{l:'Artistas',go:['artists']},{l:'Aleatório',act:shuffleAll},{l:'Baixar músicas',act:openDl},{l:'Adicionar músicas',go:['add']},{l:'Personalizar',go:['settings']});
  }else if(type==='songs'||type==='artist'){
    s.title=type==='songs'?'Músicas':arg;
    var list=sorted(type==='songs'?songs:songs.filter(function(x){return x.artist===arg;}));
    if(!list.length)s.items.push({l:'Nenhuma música. Toque para adicionar',go:['add']});
    list.forEach(function(x,i){s.items.push({l:x.title,sub:type==='songs'?x.artist:'',act:function(){play(list,i);}});});
  }else if(type==='artists'){
    s.title='Artistas';
    var names=[];songs.forEach(function(x){if(names.indexOf(x.artist)<0)names.push(x.artist);});
    names.sort(function(a,b){return a.localeCompare(b,'pt-BR');});
    if(!names.length)s.items.push({l:'Nenhum artista ainda',dim:1});
    names.forEach(function(n){s.items.push({l:n,go:['artist',n]});});
  }else if(type==='settings'){
    s.title='Personalizar';
    var n=nowSong(),pt=PRESETS[cfg.theme];
    s.items.push({l:'Tema',sub:pt?pt.l:'Personalizado',go:['choice','theme']},{l:'Cor do corpo',dot:cfg.body,go:['choice','body']},{l:'Roda',sub:cfg.wheel==='dark'?'Escura':'Clara',go:['choice','wheel']},{l:'Transparência da roda',sub:cfg.tw+'%',go:['slider','tw']},{l:'Transparência do menu',sub:cfg.tp+'%',go:['slider','tp']},{l:'Papel de parede',go:['wall']},{l:'Vídeo da tela',go:['pvid']},{l:'Layout e botões',go:['layout']},{l:'Destaque',dot:cfg.accent,go:['choice','accent']},{l:'Tela',dot:(SCREENS[cfg.screen]||SCREENS.classic).lcd,go:['choice','screen']},{l:'Tamanho do texto',sub:{s:'Pequeno',m:'Médio',l:'Grande'}[cfg.text],go:['choice','text']},{l:'Tela cheia',act:fullscreen},{l:'Ler capas e tags de novo',act:rescan},{l:'Restaurar visual padrão',act:function(){cfg=Object.assign({},DEF);applyCfg();saveCfg();refreshTop();render();toast('Visual restaurado');}});
    if(n)s.items.push({l:'Remover música atual',act:removeCurrent});
    s.items.push({l:confirmClear?'Selecione de novo para confirmar':'Apagar todas as músicas',act:clearAll});
    s.items.push({l:'Armazenadas',sub:songs.length+' faixas',dim:1});
  }else if(type==='choice'){
    var q=optsFor(arg),cv=String(cfg[arg]).toLowerCase(),found=false;
    s.title=q.t;
    q.o.forEach(function(o){var on=cv===String(o[1]).toLowerCase();if(on)found=true;s.items.push({l:o[0],dot:o[2],sub:on?'✓':'',act:function(){choose(arg,o[1]);}});});
    if(q.c)s.items.push({l:'Personalizada…',dot:found?'':cfg[arg],sub:found?'':'✓',act:function(){pick(arg);}});
    s.items.forEach(function(it,i){if(it.sub==='✓')s.idx=i;});
  }else if(type==='add'){s.title='Adicionar';}else if(type==='addm'){s.title=arg==='wall'?'Importar imagem':'Importar vídeo';}else if(type==='videos'){
    s.title='Vídeos';s.items.push({l:'Importar vídeo…',go:['addm','video']});
    videos.forEach(function(v){s.items.push({l:v.name.replace(/\.[^.]+$/,''),act:function(){playVideo(v);}});});
    if(videos.length)s.items.push({l:'Remover todos os vídeos',act:function(){if(vEl)stopVideo();mClear('video').then(function(){videos=[];toast('Vídeos removidos');refreshTop();render();});}});
  }else if(type==='slider'){s.title=SL[arg].t;}else if(type==='layout'){
    s.title='Layout e botões';
    s.items.push({l:'Disposição',sub:{ml:'Padrão',mr:'Direita',mlt:'Roda em cima',mrt:'Invertido'}[cfg.lay],go:['choice','lay']},{l:'Largura do menu',sub:cfg.cm+'%',go:['slider','cm']},{l:'Tela do canto',sub:cfg.cp+'%',go:['slider','cp']},{l:'Tamanho da roda',sub:cfg.cw+'%',go:['slider','cw']},{l:'Botões da roda',go:['keys']},{l:'Restaurar layout',act:function(){['lay','cm','cp','cw','k0','k1','k2','k3'].forEach(function(x){cfg[x]=DEF[x];});applyCfg();saveCfg();refreshTop();render();toast('Layout restaurado');}});
  }else if(type==='keys'){
    s.title='Botões da roda';
    [['Cima','k0'],['Direita','k1'],['Baixo','k2'],['Esquerda','k3']].forEach(function(p){s.items.push({l:p[0],sub:LBL[cfg[p[1]]],go:['choice',p[1]]});});
  }else if(type==='pvid'){
    s.title='Vídeo da tela';s.items.push({l:'Importar vídeo…',go:['addm','video']},{l:'Nenhum',sub:cfg.pvid?'':'✓',act:function(){setPV(null);}});
    videos.forEach(function(v){s.items.push({l:v.name.replace(/\.[^.]+$/,''),sub:cfg.pvid===v.id?'✓':'',act:function(){setPV(v.id);}});});
  }else if(type==='wall'){
    s.title='Papel de parede';s.items.push({l:'Importar imagem…',go:['addm','wall']},{l:'Nenhum',sub:cfg.wall?'':'✓',act:function(){setWall(null);}});

    if(!fs.length)throw new Error('sem mp3');

      if(cov&&cov.type.indexOf('image')!==0)cov=null;

          var s={title:cr(f.title)||f.name.replace(/\.[^.]+$/,''),artist:cr(f.creator)||cr(it.creator)||UNK,album:fs.length>1?cr(it.title):'',cover:cov,duration:0,blob:new Blob([bl],{type:'audio/mpeg'}),added:Date.now(),source:'Internet Archive',license:cr(it.licenseurl)};
          return dbAdd(s).then(function(r){songs.push(r);n++;});
        });});},Promise.resolve()).then(function(){return n;});
    });
  }).then(function(n){bt.textContent='Baixado ✓';toast(n+(n===1?' música adicionada':' músicas adicionadas'));if(stack.length){refreshTop();render();}})
  .catch(function(){bt.disabled=false;bt.textContent='Tentar de novo';dlMsg('Não foi possível baixar. Use “Ver no site” para baixar manualmente e depois importe o arquivo.');});

function jsonp(u){return new Promise(function(res,rej){
  var n='cb'+Date.now(),s=document.createElement('script'),t=setTimeout(function(){cl();rej(new Error('tempo esgotado'));},12000);
  function cl(){clearTimeout(t);delete window[n];if(s.parentNode)s.parentNode.removeChild(s);}
  window[n]=function(d){cl();res(d);};
  s.onerror=function(){cl();rej(new Error('script bloqueado'));};
  s.src=u+(u.indexOf('?')<0?'?':'&')+'callback='+n;document.head.appendChild(s);});}
function getJ(u){return fetch(u).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).catch(function(e){return jsonp(u).catch(function(){throw e;});});}
function dlErr(e,site){var t=String((e&&e.message)||e);if(/fetch|network|load failed|script/i.test(t))t='sem acesso ao site (bloqueio do navegador ou da rede)';return 'Não consegui acessar '+(site||'o Internet Archive')+': '+t+'. Se estiver no link do Claude, ele bloqueia conexões com outros sites. (app v5)';}
function dlGet(it,bt){
  bt.disabled=true;bt.textContent='Baixando…';
  var id=encodeURIComponent(it.identifier),online=false,cov=null,n=0;
  getJ('https://archive.org/metadata/'+id).then(function(m){
    var seen={},fs=(m.files||[]).filter(function(f){return (f.format==='VBR MP3'||/\.mp3$/i.test(f.name||''))&&!seen[f.name]&&(seen[f.name]=1);}).slice(0,15);
    if(!fs.length)throw new Error('item sem arquivo MP3');
    return fetch('https://archive.org/services/img/'+id).then(function(r){return r.ok?r.blob():null;}).catch(function(){return null;}).then(function(c){
      cov=(c&&c.type.indexOf('image')===0)?c:null;
      return fs.reduce(function(p,f){return p.then(function(){
        bt.textContent='Baixando '+(n+1)+'/'+fs.length+'…';
        var url='https://archive.org/download/'+id+'/'+f.name.split('/').map(encodeURIComponent).join('/');
        var s={title:cr(f.title)||f.name.replace(/\.[^.]+$/,''),artist:cr(f.creator)||cr(it.creator)||UNK,album:fs.length>1?cr(it.title):'',cover:cov,coverUrl:cov?'':'https://archive.org/services/img/'+id,duration:0,added:Date.now(),source:'Internet Archive',license:cr(it.licenseurl)};
        var get=online?Promise.reject():fetch(url).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.blob();});
        return get.then(function(bl){s.blob=new Blob([bl],{type:'audio/mpeg'});},function(){online=true;s.url=url;}).then(function(){return dbAdd(s);}).then(function(r){songs.push(r);n++;});
      });},Promise.resolve());
    });
  }).then(function(){bt.textContent='Pronto ✓';toast(n+(n===1?' música adicionada':' músicas adicionadas')+(online?'. O site não permitiu baixar o arquivo, então ela toca online.':''));if(stack.length){refreshTop();render();}})
  .catch(function(e){bt.disabled=false;bt.textContent='Tentar de novo';dlMsg(dlErr(e));});
}

    var p=(j.query&&j.query.pages)||{},list=Object.keys(p).map(function(k){var pg=p[k],ii=(pg.imageinfo||[])[0]||{},md=ii.extmetadata||{};

function coverUrl(s){if(!s)return '';if(!s.cover)return s.coverUrl||'';if(!s._cu)s._cu=URL.createObjectURL(s.cover);return s._cu;}
function readTags(b){return new Promise(function(res){
  try{if(!window.jsmediatags)return res(null);
    var t=setTimeout(function(){res(null);},4000);
    window.jsmediatags.read(b,{onSuccess:function(r){clearTimeout(t);var tg=r.tags||{},p=tg.picture,c=null;

      onError:function(){clearTimeout(t);res(null);}});
  }catch(e){res(null);}});}

function rescan(){
  if(!songs.length){toast('Nenhuma música para ler');return;}
  toast('Lendo capas e tags…');var n=0;
  songs.reduce(function(p,s){return p.then(function(){return readTags(s.blob).then(function(t){

    if(t.cover&&!s.cover){s.cover=t.cover;s._cu=null;ch=true;}
